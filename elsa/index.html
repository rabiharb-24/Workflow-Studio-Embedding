<!-- MAGNAR: Custom Top Navigation -->
<script>
(function() {
    // Wait for Blazor to fully load
    function injectTopNav() {
        const toolbar = document.querySelector('.mud-appbar .mud-toolbar');
        if (!toolbar) {
            setTimeout(injectTopNav, 500);
            return;
        }
        
        // Check if we already injected
        if (document.getElementById('magnar-top-nav')) return;
        
        // Create nav container
        const nav = document.createElement('div');
        nav.id = 'magnar-top-nav';
        nav.style.cssText = 'display: flex; gap: 8px; margin-left: 24px;';
        
        // Create Definitions button
        const defBtn = document.createElement('a');
        defBtn.href = 'workflows/definitions';
        defBtn.textContent = 'Definitions';
        defBtn.className = 'magnar-nav-btn';
        
        // Create Instances button
        const instBtn = document.createElement('a');
        instBtn.href = 'workflows/instances';
        instBtn.textContent = 'Instances';
        instBtn.className = 'magnar-nav-btn';
        
        nav.appendChild(defBtn);
        nav.appendChild(instBtn);
        
        // Insert after logo/brand area
        const logoArea = toolbar.querySelector('a, .mud-typography, img');
        if (logoArea && logoArea.parentNode === toolbar) {
            logoArea.after(nav);
        } else {
            toolbar.insertBefore(nav, toolbar.children[1] || null);
        }
    }
    
    // Start checking after DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(injectTopNav, 1000));
    } else {
        setTimeout(injectTopNav, 1000);
    }
    
    // Also try again after Blazor finishes loading
    window.addEventListener('load', () => setTimeout(injectTopNav, 2000));
})();
</script>
</body>
