<!-- MAGNAR: Custom Top Navigation (HCM Style) -->
<script>
(function() {
    function injectTopNav() {
        // Check if we already injected
        if (document.getElementById('magnar-top-nav')) return true;
        
        // Find a place to insert - body or app container
        const appContainer = document.getElementById('app');
        if (!appContainer) return false;
        
        // Create blue navigation bar
        const nav = document.createElement('div');
        nav.id = 'magnar-top-nav';
        nav.classList = ['marg-top-start-section'];
        
        // Create Definitions button
        const defBtn = document.createElement('a');
        defBtn.href = 'workflows/definitions';
        defBtn.textContent = 'Definitions';
        defBtn.className = 'magnar-nav-btn';
        
        // Create Instances button
        const instBtn = document.createElement('a');
        instBtn.href = 'workflows/instances';
        instBtn.textContent = 'Instances';
        instBtn.className = 'magnar-nav-btn';
        
        nav.appendChild(defBtn);
        nav.appendChild(instBtn);
        
        // Insert at the very beginning of body
        document.body.insertBefore(nav, document.body.firstChild);
        
        // Update active state based on current URL
        updateActiveState();
        
        return true;
    }
    
    function updateActiveState() {
        const currentPath = window.location.pathname;
        const buttons = document.querySelectorAll('.magnar-nav-btn');
        buttons.forEach(btn => {
            const href = btn.getAttribute('href');
            if (currentPath.includes(href)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
    
    // Use MutationObserver to watch for DOM changes (Blazor re-renders)
    function setupObserver() {
        const observer = new MutationObserver(function(mutations) {
            // Check if our nav is still present, re-inject if removed
            if (!document.getElementById('magnar-top-nav')) {
                injectTopNav();
            }
            // Update active state on navigation
            updateActiveState();
        });
        
        // Observe the entire app container for changes
        const appContainer = document.getElementById('app');
        if (appContainer) {
            observer.observe(appContainer, {
                childList: true,
                subtree: true
            });
        }
    }
    
    // Polling function to initially inject and setup observer
    function init() {
        if (injectTopNav()) {
            setupObserver();
        } else {
            setTimeout(init, 500);
        }
    }
    
    // Start after DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(init, 1000));
    } else {
        setTimeout(init, 1000);
    }
    
    // Also try after full page load
    window.addEventListener('load', () => setTimeout(init, 1500));
})();
</script>
